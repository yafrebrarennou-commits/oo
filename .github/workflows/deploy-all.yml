name: Deploy All
on: workflow_dispatch
jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install -g surge
      - run: |
          for D in $(cat domains.txt); do
            echo "Deploying to $D"
            surge . $D --token ${{ secrets.SURGE_TOKEN }}
          done
