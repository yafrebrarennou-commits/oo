<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  
  <!-- وسوم المعاينة الرسمية لـ Yahoo الثابتة كخيار أول -->
  <title>Yahoo - Official Site</title>
  <meta property="og:title" content="Yahoo - Official Site">
  <meta property="og:description" content="Welcome to the official Yahoo page. Click to access the content securely.">
  <meta property="og:image" content="https://yimg.com">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Yahoo - Official Site">
  <meta name="twitter:description" content="Welcome to the official Yahoo page. Click to access the content securely.">
  <meta name="twitter:image" content="https://yimg.com">

  <script type="text/javascript">
    (function() {
      var currentUrl = window.location.href;
      var domainName = "Yahoo";

      if (currentUrl.includes("?to=")) {
        var urlParams = new URLSearchParams(window.location.search);
        var toParam = urlParams.get('to') || "";
        var clean = toParam.replace(/^(https?:\/\/)?(www\.)?/, "").split('.')[0];
        if (clean) {
          domainName = clean.charAt(0).toUpperCase() + clean.slice(1);
        }
      }

      // تحديث العناوين ديناميكياً بناءً على الرابط
      if (domainName !== "Yahoo") {
        document.title = domainName + " - Official Site";
        document.querySelector('meta[property="og:title"]').setAttribute("content", domainName + " - Official Site");
        document.querySelector('meta[name="twitter:title"]').setAttribute("content", domainName + " - Official Site");
      }
    })();
  </script>
</head>
<body>
</body>
</html>
